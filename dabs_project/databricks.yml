# This is a Declarative Automation Bundle definition for dabs_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabs_project
  uuid: 69401db3-e5ca-43ea-824b-a1dd69749464

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d4e68981-9127.cloud.databricks.com
    variables:
      catalog: dev
  uat:
    mode: production
    workspace:
      host: https://dbc-d4e68981-9127.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/naval.datamaster@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/naval.datamaster@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: uat
    permissions:
      - user_name: naval.datamaster@gmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://dbc-d4e68981-9127.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/naval.datamaster@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/naval.datamaster@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
    permissions:
      - user_name: naval.datamaster@gmail.com
        level: CAN_MANAGE
