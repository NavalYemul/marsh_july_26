resources:
  jobs:
    medallion:
      name: medallion
      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: /Workspace/Users/naval.datamaster@gmail.com/marsh_july_26/dabs_project/src/dabs_project/medallion/ingestion
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: silver
          depends_on:
            - task_key: ingestion
          notebook_task:
            notebook_path: /Workspace/Users/naval.datamaster@gmail.com/marsh_july_26/dabs_project/src/dabs_project/medallion/Silver
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/naval.datamaster@gmail.com/marsh_july_26/dabs_project/src/dabs_project/medallion/gold
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
